name: Radar lanzador

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # solo para el paso que mantiene activo este repo

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Bajar el codigo privado
        uses: actions/checkout@v4
        with:
          repository: juampinuvo310-gif/radar-autos-azul
          token: ${{ secrets.RADAR_TOKEN }}
          path: radar

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install -q -r radar/requirements.txt

      - name: Pasada del radar
        id: pasada
        working-directory: radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_SILENCIOSO: '1'
          RADAR_TIEMPO_MAXIMO: '600'
        run: |
          python main.py 2> errores.txt || { echo "La pasada fallo (detalle oculto por privacidad)"; exit 1; }

      - name: Guardar memoria en el repo privado
        if: always()
        working-directory: radar
        run: |
          git config user.name "Radar Autos Putzolu"
          git config user.email "bot@autosputzolu.com"
          git add -A
          git commit -q -m "chore: actualizar historial de vistos [skip ci]" || exit 0
          git pull -q --rebase || true
          git push -q || echo "No se pudo guardar la memoria"

      - name: Avisar por Telegram si falla antes de la pasada
        if: failure() && steps.pasada.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date -u +%M)" -lt 10 ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ El Radar no pudo arrancar en GitHub. Si sigue pasando, puede que haya vencido el permiso RADAR_TOKEN." || true
          fi

      - name: Mantener activo el lanzador
        continue-on-error: true
        # GitHub apaga las tareas programadas de un repo publico si pasan 60 dias sin commits.
        # Si el ultimo commit tiene 30 dias o mas, hace uno minimo para que no se apague.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ultima=$(gh api "repos/$REPO/commits?per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
          [ -z "$ultima" ] && exit 0
          dias=$(( ( $(date -u +%s) - $(date -u -d "$ultima" +%s) ) / 86400 ))
          if [ "$dias" -ge 30 ]; then
            git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" vivo
            cd vivo
            git config user.name "Radar Autos Putzolu"
            git config user.email "bot@autosputzolu.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .ultima-actividad
            git add .ultima-actividad
            git commit -q -m "chore: mantener activo el radar [skip ci]"
            git push -q || echo "No se pudo marcar actividad"
          fi
